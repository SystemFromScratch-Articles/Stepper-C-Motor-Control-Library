<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" role="img" aria-label="Driver states" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Driver states</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F8B9A"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E07A00"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs>
<rect x="0" y="0" width="980" height="300" rx="12" fill="#FFFFFF"/>
<rect x="40" y="70" width="200" height="70" rx="10" fill="#F2F5FA" stroke="#0B2545" stroke-width="1.5"/>
<text x="140.0" y="101.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0B2545" text-anchor="middle">DISABLED</text>
<text x="140.0" y="120.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">outputs off</text>
<rect x="390" y="70" width="200" height="70" rx="10" fill="#EAF2FC" stroke="#0B2545" stroke-width="1.5"/>
<text x="490.0" y="101.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0B2545" text-anchor="middle">HOLDING</text>
<text x="490.0" y="120.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">position held</text>
<rect x="740" y="70" width="200" height="70" rx="10" fill="#EAF2FC" stroke="#1E5AA8" stroke-width="1.5"/>
<text x="840.0" y="101.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0B2545" text-anchor="middle">MOVING</text>
<text x="840.0" y="120.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">command running</text>
<rect x="565" y="205" width="200" height="70" rx="10" fill="#FDECEC" stroke="#C62828" stroke-width="1.5"/>
<text x="665.0" y="236.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="bold" fill="#0B2545" text-anchor="middle">FAULT</text>
<text x="665.0" y="255.5" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">outputs off, flags</text>
<line x1="240" y1="95" x2="388" y2="95" stroke="#1E5AA8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="314.0" y="87.0" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E5AA8" text-anchor="middle">sstep_enable()</text>
<line x1="388" y1="118" x2="242" y2="118" stroke="#5A6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="315.0" y="136.0" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">sstep_disable()</text>
<line x1="590" y1="95" x2="738" y2="95" stroke="#1E5AA8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="664.0" y="87.0" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#1E5AA8" text-anchor="middle">move / run</text>
<line x1="738" y1="118" x2="592" y2="118" stroke="#5A6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="665.0" y="136.0" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A6472" text-anchor="middle">done / stopped</text>
<path d="M490,140 L490,175 L610,175 L610,203" stroke="#C62828" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M840,140 L840,175 L720,175 L720,203" stroke="#C62828" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="780" y="230" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#C62828" text-anchor="start">overcurrent, Vbus trip,</text>
<text x="780" y="246" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="normal" fill="#C62828" text-anchor="start">HAL error,</text>
<text x="780" y="262" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="normal" fill="#C62828" text-anchor="start">sstep_report_fault()</text>
<path d="M565,250 L140,250 L140,142" stroke="#5A6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<text x="350" y="270" font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">sstep_clear_faults()  →  DISABLED</text>
<text x="490" y="36" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#5A6472" text-anchor="middle">HOLDING and MOVING are set by the slow loop from the motion mode.</text>
</svg>
